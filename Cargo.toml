[workspace]
resolver = "2"
members = ["crates/policy", "crates/core", "crates/backend-linux", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
sandbox-policy = { path = "crates/policy" }
sandbox-core = { path = "crates/core" }
sandbox-backend-linux = { path = "crates/backend-linux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
