name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y slirp4netns nftables
      - run: cargo build --workspace
      - run: sudo -E env PATH="$PATH" SANDBOX_INTEGRATION=1 SANDBOX_INTEGRATION_INTERNET=1 cargo test -p sandbox-cli --test linux -- --test-threads=4
